[package]
name = "nadir-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OS layer of the Nadir engine: windows, the event loop, input devices, GL surfaces, audio output and paths."
authors.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# docs.rs documents each system's windows, and the `dev` allocation counter too (ADR-0039).
[package.metadata.docs.rs]
features = ["dev"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[dependencies]
nadir-core.workspace = true
nadir-sys.workspace = true

[features]
# Development builds: the allocation counter, as the global allocator of
# every binary that links this crate (`alloc_counter.rs`). Turn it on only
# from a `[features]` table or a dev-dependency, so that no release build
# carries it. The facade's `dev` turns it on.
dev = []
# Builds the tests that need an EGL driver with OpenGL 3.3 (core profile),
# or libasound (ALSA's file device, which plays nothing), which then fail,
# not skip, if there is none. Linux only: elsewhere it adds nothing.
# `cargo xtask ci` turns it on, as it does every feature.
headless-test = []

[lints]
workspace = true
