[package]
name = "nadir-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "2D renderer for the Nadir engine: sprite batching, y-sort, tilemap chunks, bitmap text, a UI pass, camera and atlases."
authors.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
nadir-assets.workspace = true
nadir-codec.workspace = true
nadir-core.workspace = true
nadir-gfx.workspace = true

[features]
# Builds the tests that draw on an offscreen OpenGL 3.3 (core profile)
# context, through `nadir_gfx::Device::new_headless`, as gfx's feature of the
# same name does for gfx. `cargo xtask ci` turns it on, as it does every
# feature.
headless-test = []

[[test]]
name = "headless"
path = "tests/headless/main.rs"
required-features = ["headless-test"]

[lints]
workspace = true
