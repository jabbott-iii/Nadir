[package]
name = "nadir-render"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nadir-assets = { path = "../assets" }
nadir-codec = { path = "../codec" }
nadir-core = { path = "../core" }
nadir-gfx = { path = "../gfx" }

[features]
# Builds the tests that draw on an offscreen OpenGL 3.3 (core profile)
# context, through `nadir_gfx::Device::new_headless`, as gfx's feature of the
# same name does for gfx. `cargo xtask ci` turns it on, as it does every
# feature.
headless-test = []

[[test]]
name = "headless"
path = "tests/headless/main.rs"
required-features = ["headless-test"]

[lints]
workspace = true
