[package]
name = "nadir_engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# docs.rs documents the `dev` feature's items too (ADR-0039).
[package.metadata.docs.rs]
features = ["dev"]

# Code names the crate `nadir`. crates.io has a crate of that name already,
# so the package is nadir_engine there (ADR-0036, ADR-0039).
[lib]
name = "nadir"

[dependencies]
nadir-assets.workspace = true
nadir-audio.workspace = true
nadir-collision.workspace = true
nadir-core.workspace = true
nadir-ecs.workspace = true
nadir-gfx.workspace = true
nadir-input.workspace = true
nadir-platform.workspace = true
nadir-render.workspace = true
nadir-scene.workspace = true

[dev-dependencies]
# The tests write QOI textures, and check that a QOI file too short for
# its size is refused before anything is allocated; and they encode atlas
# files for `Sprite::from_atlas` and `Clips::add_atlas`.
nadir-codec.workspace = true

[features]
# Development builds: a failed asset shows its placeholder rather than
# nothing, and the allocation counter counts each frame's allocations
# (`FrameAllocs`). `cargo dev` turns it on through the sandbox.
dev = ["nadir-platform/dev"]

[lints]
workspace = true
