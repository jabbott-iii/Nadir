[package]
name = "nadir-gfx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Small render hardware interface for the Nadir engine, with an OpenGL 3.3 core backend."
authors.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# docs.rs documents the backend of each system too (ADR-0039).
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[dependencies]
nadir-core.workspace = true
nadir-platform.workspace = true
nadir-sys.workspace = true

[features]
# Builds the tests that draw on an offscreen OpenGL 3.3 (core profile)
# context, which then fail, not skip, without a working driver. Where
# `nadir-platform` has no offscreen context yet (Windows and macOS, until
# M2.6 and M2.7), they skip. `cargo xtask ci` turns it on, as it does every
# feature.
headless-test = []

[[test]]
name = "headless"
path = "tests/headless/main.rs"
required-features = ["headless-test"]

[lints]
workspace = true
