# Publishes a release of Nadir when a tag `v<version>` is pushed: the
# programs for six targets on the GitHub release, a signed apt repository
# beside them, the cook's container image on ghcr.io, and the crates on
# crates.io (ADR-0036). It is specified in docs/05-release.md, under
# "Engine releases", with the secrets and settings it needs.
#
# Rules for this file, as for ci.yml, with the exceptions ADR-0036 makes:
# - Pin every action by its full commit SHA, with the tag in a comment.
# - Use no actions other than actions/checkout and
#   actions/upload-artifact / download-artifact.
# - Install the toolchain with rustup, not with an action.
# - Only the publishing jobs may write: `release` to the repository's
#   releases (contents), `image` to its packages.
# - The secrets are in two environments, which only `v*` tags may use:
#   `release` holds APT_SIGNING_KEY, `crates-io` CARGO_REGISTRY_TOKEN.
#
# crates.io publishes first: it refuses what no local check sees, and
# nothing else is published until it has taken every crate. The GitHub
# release and the image follow, and either can run again.

name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

defaults:
  run:
    # The same shell on all three systems, so each step means the same thing.
    shell: bash

# One release at a time, and none cancelled: a second tag waits.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Decides whether the tag is a release before anything is built: it must
  # name the workspace's version, be on main, and be a commit CI passed.
  gate:
    name: Check the tag
    if: github.repository == 'jabbott-iii/Nadir'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # To find CI's runs of the commit.
      actions: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      # All of main's history, to see whether the tag is on it.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag, the version and CI
        id: check
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -I -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag is $TAG, but the workspace's version is $version: tag v$version, or raise the version first."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "::error::$TAG is not on main: a release is made from main's history."
            exit 1
          fi
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT&event=push&status=success" --jq .total_count)
          if [ "$passed" = 0 ]; then
            echo "::error::CI has not passed on $COMMIT. Wait for it, then re-run this workflow."
            exit 1
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  # Each target on a runner of its own system and processor, so that what
  # it builds runs there before it is released.
  build:
    name: Build ${{ matrix.target }}
    needs: gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      # A release needs every target.
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            image: amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            image: arm64
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15

    steps:
      # Git on Windows would otherwise check text files out with CRLF line
      # endings, and the cook would read other bytes than it does elsewhere.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # With no toolchain named, rustup installs the one that
      # rust-toolchain.toml pins, with the components listed there.
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      - name: Show the toolchain
        run: cargo --version --verbose

      # `dist` names its files for the host it builds on: it must be the
      # target this job is for.
      - name: Check the host is the target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "$TARGET" ]; then
            echo "::error::This runner builds for $host, not $TARGET."
            exit 1
          fi

      # dpkg-shlibdeps (dpkg-dev) for the packages' dependencies; EGL and
      # Mesa's software renderer for the sandbox's capture below.
      - name: Install the Debian tools, EGL and Mesa
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dpkg-dev libegl1 libgl1-mesa-dri libopengl0

      # Builds, lays out and runs the programs, then packs them
      # (xtask/src/dist.rs). `--locked`: a Cargo.lock that the version's
      # raise left behind fails here, not by being rewritten.
      - name: Build the release files
        run: cargo --locked xtask dist --out target/dist

      # More than `dist` can do on every system: the sandbox, from its
      # archive, draws 10 seconds of the field offscreen with its sprites.
      - name: Draw the sandbox from its archive
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          STEM: nadir-${{ needs.gate.outputs.version }}-${{ matrix.target }}
        run: |
          tar -xzf "target/dist/$STEM.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/$STEM/sandbox" --capture "$RUNNER_TEMP/capture"
          grep -q '"frames": 600' "$RUNNER_TEMP/capture/capture.json"
          rm -rf "$RUNNER_TEMP/capture"

      # The container image's cook: linked statically against musl, so the
      # image needs nothing else.
      - name: Build the image's cook
        if: matrix.image != ''
        env:
          MUSL: ${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}-unknown-linux-musl
          VERSION: ${{ needs.gate.outputs.version }}
          IMAGE_ARCH: ${{ matrix.image }}
        run: |
          rustup target add "$MUSL"
          cargo build --release --locked --target "$MUSL" --package nadir-cook
          mkdir -p target/image
          cp "target/$MUSL/release/nadir-cook" "target/image/nadir-cook-$IMAGE_ARCH"
          test "$("target/image/nadir-cook-$IMAGE_ARCH" --version)" = "nadir-cook $VERSION"

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: target/dist/*
          if-no-files-found: error

      - name: Upload the image's cook
        if: matrix.image != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image }}
          path: target/image/*
          if-no-files-found: error

  # Every crate the workspace gives crates.io, in the order of their
  # dependencies (`cargo xtask crates` checks they can go). cargo packages
  # and builds every crate before it uploads one, so a crate that will
  # not build from its package, or a stale Cargo.lock, stops the release
  # with nothing published.
  crates:
    name: Publish the crates
    needs: [gate, build]
    runs-on: ubuntu-24.04
    # crates.io takes 5 new crates at once, then one each 10 minutes: the
    # first release, of 13, waits about 80 minutes.
    timeout-minutes: 180
    environment:
      name: crates-io
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      # crates.io takes each version once, and cargo refuses to start when
      # one it was given is there: each attempt leaves out the crates there
      # already, those a failed attempt or job published. An attempt that
      # crates.io stops for publishing too many new crates (429), or that
      # times out waiting for one to show in the index, is tried again
      # after a wait; any other failure ends the job.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::The crates-io environment has no CARGO_REGISTRY_TOKEN secret (docs/05-release.md)."
            exit 1
          fi
          crates=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.publish == null) | .name')
          log="$RUNNER_TEMP/publish.log"
          for attempt in $(seq 1 15); do
            exclude=()
            left=()
            for name in $crates; do
              status=$(curl -s -o /dev/null -w '%{http_code}' -A "jabbott-iii/Nadir release workflow" "https://crates.io/api/v1/crates/$name/$VERSION")
              if [ "$status" = 200 ]; then
                exclude+=(--exclude "$name")
              else
                left+=("$name")
              fi
            done
            if [ "${#left[@]}" = 0 ]; then
              echo "Every crate is on crates.io at $VERSION."
              exit 0
            fi
            echo "Attempt $attempt: publishing ${left[*]}"
            if cargo publish --workspace --locked "${exclude[@]}" 2>&1 | tee "$log"; then
              exit 0
            elif grep -q 'status 429' "$log"; then
              echo "crates.io limits new crates: waiting 10 minutes."
              sleep 610
            elif grep -q 'timeout while waiting' "$log"; then
              sleep 60
            else
              exit 1
            fi
          done
          echo "::error::The crates were not all published after 15 attempts."
          exit 1

  # The GitHub release: the archives, the packages, the apt repository
  # made of them, and their SHA-256 sums. Made as a draft, and published
  # once every file is on it, so that the newest release's files, which
  # apt reads, are never half there.
  release:
    name: Publish the GitHub release
    needs: [gate, build, crates]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: release
          merge-multiple: true

      - name: Install apt-ftparchive
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y apt-utils

      # The key lives in this job's keyring alone, which goes with the
      # runner.
      - name: Make and sign the apt repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::error::The release environment has no APT_SIGNING_KEY secret (docs/05-release.md)."
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          key=$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')
          .github/release/apt-repo.sh release "$key"
          rm -rf "$GNUPGHOME"

      - name: Sum the files
        working-directory: release
        run: sha256sum -- * > SHA256SUMS

      # A draft left by a failed attempt is filled again; a published
      # release is never changed.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.gate.outputs.version }}
          PRERELEASE: ${{ needs.gate.outputs.prerelease }}
        run: |
          state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null || echo none)
          if [ "$state" = false ]; then
            echo "::error::$TAG is published already: a release is never changed."
            exit 1
          elif [ "$state" = none ]; then
            flags=(--draft --verify-tag --title "Nadir $VERSION" --generate-notes)
            if [ "$PRERELEASE" = true ]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" "${flags[@]}" release/*
          else
            gh release upload "$TAG" --clobber release/*
          fi
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --draft=false --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi

  # ghcr.io/jabbott-iii/nadir-cook, for linux/amd64 and linux/arm64: the
  # version's tag, and `latest` unless it is a pre-release.
  image:
    name: Publish the container image
    needs: [gate, build, crates]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/jabbott-iii/nadir-cook
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the image's cooks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: target/image
          merge-multiple: true

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # The Dockerfile only copies files, so neither platform needs an
      # emulator. The daemon's own builder makes one platform at a time: a
      # builder in a container (BuildKit's moby/buildkit image) makes both
      # into one image. With no provenance attestation, the image's index
      # lists the two platforms alone. Pushed with this job's token, the
      # package is linked to the repository.
      - name: Build and push
        env:
          PRERELEASE: ${{ needs.gate.outputs.prerelease }}
        run: |
          chmod +x target/image/nadir-cook-*
          cp LICENSE NOTICE target/image/
          tags=(--tag "$IMAGE:$VERSION")
          if [ "$PRERELEASE" != true ]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          docker buildx create --name nadir --driver docker-container --bootstrap --use
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$VERSION" \
            --file tools/cook/Dockerfile \
            --provenance=false \
            --sbom=false \
            "${tags[@]}" \
            --push \
            target/image

      - name: Run the pushed image
        run: test "$(docker run --rm --platform linux/amd64 "$IMAGE:$VERSION" --version)" = "nadir-cook $VERSION"

      - name: Log out
        if: always()
        run: docker logout ghcr.io
