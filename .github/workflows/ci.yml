# The gate for every push and pull request. It is specified in
# docs/04-quality.md, under "CI (GitHub Actions)".
#
# Rules for this file:
# - Pin every action by its full commit SHA, with the tag in a comment.
# - Use no actions other than actions/checkout, actions/cache and
#   actions/upload-artifact / download-artifact.
# - Install the toolchain with rustup, not with an action.
# - The token may only read the repository.
# `cargo xtask workflows`, part of `cargo xtask ci`, checks the first two
# and the last, in every workflow (ADR-0032).

name: CI

on:
  # Branches only: a pushed tag starts the release workflow, not this one.
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    # The same shell on all three systems, so each step means the same thing.
    shell: bash

# A newer push to a pull request's branch cancels its older run. A push to a
# branch is a group of its own, never cancelled or held back: a group lets
# only one run wait, so a third push would cancel the second, and every
# commit of main needs its verdict, which the demo page's workflow waits for.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Let every system finish: a failure on one says nothing of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # Git on the Windows runners would otherwise check text files out with
      # CRLF line endings, and the tests that compare against committed
      # files byte for byte would fail.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # With no toolchain named, rustup installs the one that
      # rust-toolchain.toml pins, with the components listed there.
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      - name: Show the toolchain
        run: cargo --version --verbose

      - name: Restore the build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      # The OpenGL tests of nadir-platform and nadir-gfx (feature
      # headless-test, which the checks turn on) need EGL and Mesa's
      # software renderer, llvmpipe; nadir-platform's ALSA tests need
      # libasound, whose file device plays nothing.
      - name: Install EGL, Mesa and ALSA
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1-mesa-dri libasound2t64

      - name: Run the checks
        id: checks
        run: cargo xtask ci
        env:
          # Mesa renders on the CPU, and the tests fail on any other renderer.
          LIBGL_ALWAYS_SOFTWARE: "1"
          NADIR_EXPECT_GL_RENDERER: ${{ runner.os == 'Linux' && 'llvmpipe' || '' }}

      # The references in tests/golden were drawn on llvmpipe, and every
      # scene must be drawn there too. docs/04-quality.md says why the
      # Windows and macOS runners do not draw them.
      #
      # The checks draw the same scenes, and fail when a scene's own pixel
      # checks do. This step still runs then, to show how the scenes differ.
      - name: Golden images
        id: golden
        if: runner.os == 'Linux' && (success() || steps.checks.outcome == 'failure')
        run: cargo xtask golden
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          NADIR_EXPECT_GL_RENDERER: llvmpipe

      # What a failed scene drew (<scene>.actual.qoi) and, for a scene over
      # the tolerance, where (<scene>.diff.qoi).
      - name: Upload the golden failures
        if: failure() && steps.golden.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failures
          path: target/golden/*.qoi

      # `--secs` is the time for each fuzz target. The fuzzer is built
      # optimized, so 30 s tries more inputs than 120 s of a dev build did,
      # for every target but `klz`, which compresses each input and gains
      # about 3.4 times (ADR-0028).
      - name: Fuzz smoke
        if: runner.os == 'Linux'
        run: cargo xtask fuzz-smoke --secs 30
