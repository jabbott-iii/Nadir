# Code scanning: CodeQL reads the Rust code and these workflows for
# security problems, and reports what it finds in the repository's
# Security tab. It is specified in docs/04-quality.md, under "CI (GitHub
# Actions)", and ADR-0032.
#
# Rules for this file, as for ci.yml, with the exception ADR-0032 makes:
# - Pin every action by its full commit SHA, with the tag in a comment.
# - Use no actions other than actions/checkout and GitHub's CodeQL action,
#   github/codeql-action (init and analyze).
# - Only the analysis job may write, and only its results to code scanning.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so that new queries also look at code that has not changed.
  schedule:
    - cron: "27 2 * * 0"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

# A newer push to a pull request's branch cancels its older analysis. Any
# other run is a group of its own, as in ci.yml.
concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # To upload the results to code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Rust is read from the source, with no build. `actions` is the
        # workflows in .github/workflows: injection, untrusted checkouts,
        # unpinned actions, and tokens with more than they need.
        language: [rust, actions]

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # security-extended adds the queries of lower precision or severity to
      # the default suite: more to triage, and fewer problems missed.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
