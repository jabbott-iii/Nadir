[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/sys",
    "crates/platform",
    "crates/gfx",
    "crates/codec",
    "crates/ecs",
    "crates/input",
    "crates/render",
    "crates/audio",
    "crates/assets",
    "crates/collision",
    "crates/scene",
    "crates/debug",
    "crates/engine",
    "tools/cook",
    "xtask",
    "games/sandbox",
    "bench",
]

# `cargo xtask` runs xtask, and so the parsers it fuzzes, built with this:
# optimized, so that a fuzz run tries more inputs in its time, with the dev
# profile's overflow checks and debug assertions still on (ADR-0028).
[profile.xtask]
inherits = "dev"
opt-level = 3

# What every member inherits. The package name crates.io knows the facade
# by, nadir_engine, is in crates/engine/Cargo.toml: `nadir` is taken there
# (ADR-0036, ADR-0039).
[workspace.package]
version = "0.1.1"
edition = "2024"
authors = ["Joseph Anthony Abbott III <jabbottpublicsupport@gmail.com>"]
description = "A lightweight, cross-platform Rust engine."
license = "Apache-2.0"
readme = "README.md"
homepage = "https://jabbott.dev/Nadir/"
repository = "https://github.com/jabbott-iii/Nadir"
keywords = ["2d", "game-engine", "top-down", "gamedev", "rust"]
categories = ["game-engines", "game-development", "graphics"]

# The workspace's crates, by path here and by version on crates.io, which
# a published crate's dependencies must name. A release raises `version`
# above and each of these with it; `cargo xtask crates` checks that they
# agree (ADR-0036).
[workspace.dependencies]
nadir = { path = "crates/engine", version = "0.1.1", package = "nadir_engine" }
nadir-assets = { path = "crates/assets", version = "0.1.1" }
nadir-codec = { path = "crates/codec", version = "0.1.1" }
nadir-collision = { path = "crates/collision", version = "0.1.1" }
nadir-core = { path = "crates/core", version = "0.1.1" }
nadir-ecs = { path = "crates/ecs", version = "0.1.1" }
nadir-gfx = { path = "crates/gfx", version = "0.1.1" }
nadir-input = { path = "crates/input", version = "0.1.1" }
nadir-platform = { path = "crates/platform", version = "0.1.1" }
nadir-render = { path = "crates/render", version = "0.1.1" }
nadir-scene = { path = "crates/scene", version = "0.1.1" }
nadir-sys = { path = "crates/sys", version = "0.1.1" }

[workspace.lints.rust]
unsafe_code = "deny"              # sys, platform, gfx override with #![allow(unsafe_code)]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"
